- name: libvirt role setup tasks
  block:
  - include_tasks: install_setup_tasks.yml
  - include_tasks: network_setup_tasks.yml
  - include_tasks: vm_setup_tasks.yml
    when: vm_platform == "libvirt"
  when: libvirt_action == "setup"

- name: libvirt role teardown tasks
  block:
  - include_tasks: network_teardown_tasks.yml
  - include_tasks: vm_teardown_tasks.yml
    when: vm_platform == "libvirt"
  - name: Check ownership before removing the ToR demo bridge
    command: ovs-vsctl --if-exists get Bridge tor-switch external_ids
    register: tor_demo_bridge_ids
    changed_when: false
    when: enable_tor_demo
  - name: Refuse to remove an unrelated OVS bridge
    assert:
      that:
      - >-
        tor_demo_bridge_ids.stdout == '' or
        (tor_demo_bridge_ids.stdout | replace('"', '') |
        regex_search('(^|[,{ ])metal3-dev-env=tor-demo([,} ]|$)')) is not none
      fail_msg: "Refusing to delete tor-switch without the metal3-dev-env=tor-demo ownership marker"
    when: enable_tor_demo
  - name: Stop and disable the ToR demo persistent-tap service
    systemd:
      name: metal3-tor-taps.service
      state: stopped
      enabled: false
      daemon_reload: true
    failed_when: false
    when: enable_tor_demo
    become: true
  - name: Remove the ToR demo persistent-tap units
    file:
      path: "{{ item }}"
      state: absent
    with_items:
    - /etc/systemd/system/metal3-tor-taps.service
    - /usr/local/sbin/metal3-tor-taps.sh
    when: enable_tor_demo
    become: true
  - name: Remove the ToR demo persistent taps
    shell: >-
      for t in $(ip -o link show | awk -F': ' '{print $2}' |
      grep -E '^tor-port-[0-9]+$'); do ip link delete dev "$t" || true; done
    when: enable_tor_demo
    changed_when: false
    become: true
  - name: Remove the ToR demo bridge after its VMs
    command: ovs-vsctl --if-exists del-br tor-switch
    when: enable_tor_demo and tor_demo_bridge_ids.stdout != ''
    become: true
  when: libvirt_action == "teardown"
